<!DOCTYPE html>
<html lang="zh-CN" data-theme="light">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>自选股管理 - 财务数据分析</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <!-- 顶部导航栏 -->
    <header class="header">
        <div class="header-left">
            <a href="/" class="logo">
                <i class="fas fa-chart-line"></i>
                <span>股票财务分析</span>
            </a>
        </div>
        <div class="header-center">
            <div class="search-box">
                <input type="text" id="stockSearch" placeholder="输入股票代码/名称">
                <button onclick="searchStock()">
                    <i class="fas fa-search"></i>
                </button>
            </div>
        </div>
        <div class="header-right">
            <a href="/stock_detail.html" class="nav-btn" title="股票详情">
                <i class="fas fa-chart-bar"></i>
            </a>
            <button class="theme-toggle" onclick="toggleTheme()" title="切换主题">
                <i class="fas fa-moon" id="themeIcon"></i>
            </button>
        </div>
    </header>

    <!-- 主内容区 -->
    <main class="main-content">
        <!-- 自选股管理卡片 -->
        <section class="stock-info-card">
            <div class="section-header">
                <h2><i class="fas fa-star"></i> 自选股管理</h2>
                <div class="action-buttons">
                    <button class="import-btn" onclick="showImportModal()" title="批量导入自选股">
                        <i class="fas fa-upload"></i> 批量导入
                    </button>
                    <button class="export-btn" onclick="exportMyStocks()" title="导出自选股">
                        <i class="fas fa-download"></i> 导出
                    </button>
                    <button class="refresh-hudong-btn" onclick="refreshAllHudongData()" title="刷新所有自选股的互动问答数据">
                        <i class="fas fa-comments"></i> 刷新互动数据
                    </button>
                    <button class="refresh-market-btn" onclick="refreshAllMarketData()" title="刷新所有自选股的行情数据">
                        <i class="fas fa-chart-line"></i> 刷新行情
                    </button>
                </div>
            </div>
            
            <!-- 池类型切换 -->
            <div class="pool-tabs">
                <button class="pool-tab active" data-pool="all" onclick="switchPool('all')">
                    全部 (<span id="countAll">0</span>)
                </button>
                <button class="pool-tab" data-pool="core" onclick="switchPool('core')">
                    <i class="fas fa-fire"></i> 核心池 (<span id="countCore">0</span>)
                </button>
                <button class="pool-tab" data-pool="watch" onclick="switchPool('watch')">
                    <i class="fas fa-eye"></i> 观察池 (<span id="countWatch">0</span>)
                </button>
            </div>
            
            <!-- 自选股列表 -->
            <div class="stock-list-container">
                <div id="stockList" class="stock-list">
                    <div class="loading">加载中...</div>
                </div>
            </div>
        </section>
    </main>

    <!-- 添加到自选股弹窗 -->
    <div id="addModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>添加到自选股</h3>
                <button class="modal-close" onclick="closeAddModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>股票代码</label>
                    <input type="text" id="addStockCode" readonly>
                </div>
                <div class="form-group">
                    <label>股票名称</label>
                    <input type="text" id="addStockName" readonly>
                </div>
                <div class="form-group">
                    <label>选择池</label>
                    <div class="pool-select">
                        <label class="radio-label">
                            <input type="radio" name="poolType" value="core">
                            <span class="radio-custom"></span>
                            <i class="fas fa-fire"></i> 核心池
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="poolType" value="watch" checked>
                            <span class="radio-custom"></span>
                            <i class="fas fa-eye"></i> 观察池
                        </label>
                    </div>
                </div>
                <div class="form-group">
                    <label>备注</label>
                    <textarea id="addNotes" rows="3" placeholder="可选：添加备注信息"></textarea>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeAddModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmAddStock()">确认添加</button>
            </div>
        </div>
    </div>

    <!-- 批量导入弹窗 -->
    <div id="importModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>批量导入自选股</h3>
                <button class="modal-close" onclick="closeImportModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>选择文件或粘贴股票代码</label>
                    <input type="file" id="importFile" accept=".txt,.csv" onchange="handleFileSelect()">
                    <textarea id="importText" rows="8" placeholder="每行一个股票代码或股票名称&#10;&#10;例如：&#10;688456&#10;000858&#10;贵州茅台&#10;紫光股份"></textarea>
                </div>
                <div class="form-group">
                    <label>目标池</label>
                    <div class="pool-select">
                        <label class="radio-label">
                            <input type="radio" name="importPool" value="core">
                            <span class="radio-custom"></span>
                            <i class="fas fa-fire"></i> 核心池
                        </label>
                        <label class="radio-label">
                            <input type="radio" name="importPool" value="watch" checked>
                            <span class="radio-custom"></span>
                            <i class="fas fa-eye"></i> 观察池
                        </label>
                    </div>
                </div>
                <div id="importResult" class="import-result"></div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeImportModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmImport()">开始导入</button>
            </div>
        </div>
    </div>

    <!-- 移动到弹窗 -->
    <div id="moveModal" class="modal">
        <div class="modal-content">
            <div class="modal-header">
                <h3>移动自选股</h3>
                <button class="modal-close" onclick="closeMoveModal()">&times;</button>
            </div>
            <div class="modal-body">
                <div class="form-group">
                    <label>股票</label>
                    <input type="text" id="moveStockInfo" readonly>
                </div>
                <div class="form-group">
                    <label>当前池</label>
                    <span id="moveFromPool"></span>
                </div>
                <div class="form-group">
                    <label>移动到</label>
                    <div class="pool-select">
                        <label class="radio-label" id="moveToCoreLabel">
                            <input type="radio" name="moveToPool" value="core">
                            <span class="radio-custom"></span>
                            <i class="fas fa-fire"></i> 核心池
                        </label>
                        <label class="radio-label" id="moveToWatchLabel">
                            <input type="radio" name="moveToPool" value="watch">
                            <span class="radio-custom"></span>
                            <i class="fas fa-eye"></i> 观察池
                        </label>
                    </div>
                </div>
            </div>
            <div class="modal-footer">
                <button class="btn btn-secondary" onclick="closeMoveModal()">取消</button>
                <button class="btn btn-primary" onclick="confirmMoveStock()">确认移动</button>
            </div>
        </div>
    </div>

    <script src="js/app.js"></script>
    <script>
        let currentPool = 'all';
        let pendingStockCode = '';
        let pendingStockName = '';
        let pendingFromPool = '';

        // 切换池类型
        async function switchPool(pool) {
            currentPool = pool;
            
            // 更新标签样式
            document.querySelectorAll('.pool-tab').forEach(tab => {
                tab.classList.toggle('active', tab.dataset.pool === pool);
            });
            
            // 加载自选股列表
            await loadMyStocks();
        }

        // 加载自选股列表
        async function loadMyStocks() {
            const listContainer = document.getElementById('stockList');
            listContainer.innerHTML = '<div class="loading">加载中...</div>';
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/my_stocks`);
                const result = await response.json();
                
                if (result.success && result.data) {
                    // 更新计数
                    const counts = result.data.counts || {};
                    document.getElementById('countAll').textContent = 
                        (counts.core || 0) + (counts.watch || 0);
                    document.getElementById('countCore').textContent = counts.core || 0;
                    document.getElementById('countWatch').textContent = counts.watch || 0;
                    
                    // 过滤并显示列表
                    let stocks = result.data.stocks || [];
                    if (currentPool !== 'all') {
                        stocks = stocks.filter(s => s.pool_type === currentPool);
                    }
                    
                    if (stocks.length === 0) {
                        listContainer.innerHTML = '<div class="empty-state">暂无自选股</div>';
                        return;
                    }
                    
                    listContainer.innerHTML = stocks.map(stock => `
                        <div class="stock-item">
                            <div class="stock-info" onclick="goToDetail('${stock.code}')">
                                <span class="pool-badge ${stock.pool_type}">${stock.pool_type === 'core' ? '核心池' : '观察池'}</span>
                                <span class="stock-code">${stock.code}</span>
                                <span class="stock-name">${stock.name || stock.code}</span>
                                ${stock.notes ? `<span class="stock-notes">${stock.notes}</span>` : ''}
                            </div>
                            <div class="stock-actions">
                                <button class="action-btn" onclick="showMoveModal('${stock.code}', '${stock.name}', '${stock.pool_type}')" title="移动">
                                    <i class="fas fa-exchange-alt"></i>
                                </button>
                                <button class="action-btn danger" onclick="removeStock('${stock.code}', '${stock.pool_type}')" title="移除">
                                    <i class="fas fa-trash"></i>
                                </button>
                            </div>
                        </div>
                    `).join('');
                } else {
                    listContainer.innerHTML = '<div class="error-state">加载失败</div>';
                }
            } catch (error) {
                console.error('加载自选股失败:', error);
                listContainer.innerHTML = '<div class="error-state">加载失败，请稍后重试</div>';
            }
        }

        // 跳转到股票详情页
        function goToDetail(code) {
            window.location.href = `stock_detail.html?code=${code}`;
        }

        // 显示移动弹窗
        function showMoveModal(code, name, fromPool) {
            pendingStockCode = code;
            pendingStockName = name;
            pendingFromPool = fromPool;
            
            document.getElementById('moveStockInfo').value = `${name} (${code})`;
            document.getElementById('moveFromPool').textContent = fromPool === 'core' ? '核心池' : '观察池';
            
            // 禁用源池选项
            document.getElementById('moveToCoreLabel').style.display = fromPool === 'core' ? 'none' : '';
            document.getElementById('moveToWatchLabel').style.display = fromPool === 'watch' ? 'none' : '';
            
            // 重置单选框
            document.querySelectorAll('input[name="moveToPool"]').forEach(radio => {
                radio.checked = false;
            });
            
            document.getElementById('moveModal').style.display = 'flex';
        }

        // 关闭移动弹窗
        function closeMoveModal() {
            document.getElementById('moveModal').style.display = 'none';
        }

        // 确认移动
        async function confirmMoveStock() {
            const toPool = document.querySelector('input[name="moveToPool"]:checked')?.value;
            if (!toPool) {
                alert('请选择目标池');
                return;
            }
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/my_stock/${pendingStockCode}/move`, {
                    method: 'PUT',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        from_pool: pendingFromPool,
                        to_pool: toPool
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    closeMoveModal();
                    await loadMyStocks();
                } else {
                    alert(result.message || '移动失败');
                }
            } catch (error) {
                console.error('移动失败:', error);
                alert('移动失败，请稍后重试');
            }
        }

        // 移除自选股
        async function removeStock(code, poolType) {
            if (!confirm('确定要移除该自选股吗？')) return;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/my_stock/${code}?pool_type=${poolType}`, {
                    method: 'DELETE'
                });
                
                const result = await response.json();
                if (result.success) {
                    await loadMyStocks();
                } else {
                    alert(result.message || '移除失败');
                }
            } catch (error) {
                console.error('移除失败:', error);
                alert('移除失败，请稍后重试');
            }
        }

        // 关闭添加弹窗
        function closeAddModal() {
            document.getElementById('addModal').style.display = 'none';
        }

        // 显示添加弹窗
        function showAddModal(code, name) {
            pendingStockCode = code;
            pendingStockName = name;
            
            document.getElementById('addStockCode').value = code;
            document.getElementById('addStockName').value = name;
            document.getElementById('addNotes').value = '';
            document.querySelector('input[name="poolType"][value="watch"]').checked = true;
            
            document.getElementById('addModal').style.display = 'flex';
        }

        // 确认添加
        async function confirmAddStock() {
            const poolType = document.querySelector('input[name="poolType"]:checked')?.value;
            const notes = document.getElementById('addNotes').value;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/my_stock/${pendingStockCode}`, {
                    method: 'POST',
                    headers: {'Content-Type': 'application/json'},
                    body: JSON.stringify({
                        pool_type: poolType,
                        name: pendingStockName,
                        notes: notes
                    })
                });
                
                const result = await response.json();
                if (result.success) {
                    closeAddModal();
                    await loadMyStocks();
                    alert('添加成功！');
                } else {
                    alert(result.message || '添加失败');
                }
            } catch (error) {
                console.error('添加失败:', error);
                alert('添加失败，请稍后重试');
            }
        }

        // 显示批量导入弹窗
        function showImportModal() {
            document.getElementById('importFile').value = '';
            document.getElementById('importText').value = '';
            document.getElementById('importResult').innerHTML = '';
            document.querySelector('input[name="importPool"][value="watch"]').checked = true;
            document.getElementById('importModal').style.display = 'flex';
        }

        // 关闭批量导入弹窗
        function closeImportModal() {
            document.getElementById('importModal').style.display = 'none';
        }

        // 处理文件选择
        function handleFileSelect() {
            const fileInput = document.getElementById('importFile');
            const file = fileInput.files[0];
            if (file) {
                const reader = new FileReader();
                reader.onload = function(e) {
                    document.getElementById('importText').value = e.target.result;
                };
                reader.readAsText(file, 'UTF-8');
            }
        }

        // 确认批量导入
        async function confirmImport() {
            const text = document.getElementById('importText').value.trim();
            if (!text) {
                alert('请输入股票代码或选择文件');
                return;
            }

            const poolType = document.querySelector('input[name="importPool"]:checked')?.value || 'watch';
            const lines = text.split(/\r?\n/).filter(line => line.trim());
            
            const resultDiv = document.getElementById('importResult');
            resultDiv.innerHTML = '<div class="loading">正在导入...</div>';

            let successCount = 0;
            let failCount = 0;
            let existsCount = 0;

            for (let i = 0; i < lines.length; i++) {
                const input = lines[i].trim();
                if (!input) continue;

                try {
                    const response = await fetch(`${API_BASE_URL}/api/my_stock/batch`, {
                        method: 'POST',
                        headers: {'Content-Type': 'application/json'},
                        body: JSON.stringify({
                            input: input,
                            pool_type: poolType
                        })
                    });

                    const result = await response.json();
                    if (result.success) {
                        if (result.exists) {
                            existsCount++;
                        } else {
                            successCount++;
                        }
                    } else {
                        failCount++;
                    }
                } catch (error) {
                    failCount++;
                }

                resultDiv.innerHTML = `<div style="color: var(--text-secondary);">正在导入: ${i + 1}/${lines.length}</div>`;
            }

            resultDiv.innerHTML = `
                <div style="color: var(--success-color);">成功添加: ${successCount} 只</div>
                <div style="color: var(--warning-color);">已存在: ${existsCount} 只</div>
                <div style="color: var(--danger-color);">导入失败: ${failCount} 只</div>
            `;

            await loadMyStocks();
        }

        // 导出自选股
        async function exportMyStocks() {
            try {
                const response = await fetch(`${API_BASE_URL}/api/my_stocks`);
                const result = await response.json();

                if (!result.success || !result.data?.stocks) {
                    alert('获取自选股列表失败');
                    return;
                }

                const stocks = result.data.stocks;
                let content = '';
                
                stocks.forEach(stock => {
                    content += `${stock.code} ${stock.name}\n`;
                });

                const blob = new Blob([content], { type: 'text/plain;charset=utf-8' });
                const url = URL.createObjectURL(blob);
                const a = document.createElement('a');
                a.href = url;
                a.download = `自选股_${new Date().toLocaleDateString('zh-CN').replace(/\//g, '-')}.txt`;
                document.body.appendChild(a);
                a.click();
                document.body.removeChild(a);
                URL.revokeObjectURL(url);

                alert(`成功导出 ${stocks.length} 只自选股`);
            } catch (error) {
                console.error('导出失败:', error);
                alert('导出失败，请稍后重试');
            }
        }

        // 刷新所有自选股的互动问答数据
        async function refreshAllHudongData() {
            const response = await fetch(`${API_BASE_URL}/api/my_stocks`);
            const result = await response.json();
            
            if (!result.success || !result.data) {
                alert('获取自选股列表失败');
                return;
            }
            
            const stocks = result.data.stocks || [];
            if (stocks.length === 0) {
                alert('自选股列表为空');
                return;
            }
            
            const btn = document.querySelector('.refresh-hudong-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            btn.disabled = true;
            
            let successCount = 0;
            let failCount = 0;
            const total = stocks.length;
            
            // 逐个刷新，避免并发请求过多
            for (let i = 0; i < stocks.length; i++) {
                const stock = stocks[i];
                
                try {
                    const response = await fetch(`${API_BASE_URL}/api/stock/${stock.code}/qa/fetch`, {
                        method: 'POST'
                    });
                    const data = await response.json();
                    
                    if (data.success) {
                        successCount++;
                    } else {
                        failCount++;
                    }
                } catch (error) {
                    failCount++;
                }
                
                // 更新按钮显示进度
                btn.innerHTML = `<i class="fas fa-spinner fa-spin"></i> 刷新中 ${i + 1}/${total}`;
            }
            
            btn.innerHTML = originalText;
            btn.disabled = false;
            
            alert(`刷新完成！\n成功: ${successCount} 只\n失败: ${failCount} 只`);
        }

        /**
         * 刷新所有自选股的行情数据
         */
        async function refreshAllMarketData() {
            const btn = document.querySelector('.refresh-market-btn');
            const originalText = btn.innerHTML;
            btn.innerHTML = '<i class="fas fa-spinner fa-spin"></i> 刷新中...';
            btn.disabled = true;
            
            try {
                const response = await fetch(`${API_BASE_URL}/api/my_stock/refresh_market`, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json'
                    }
                });
                
                const result = await response.json();
                
                if (result.success) {
                    const data = result.data;
                    let message = `行情数据刷新完成！\n成功: ${data.success} 只\n失败: ${data.failed} 只`;
                    if (data.failed_stocks && data.failed_stocks.length > 0) {
                        message += `\n失败股票: ${data.failed_stocks.join(', ')}`;
                    }
                    alert(message);
                } else {
                    alert('刷新失败: ' + result.message);
                }
            } catch (error) {
                console.error('刷新行情数据失败:', error);
                alert('刷新失败，请检查网络连接');
            } finally {
                btn.innerHTML = originalText;
                btn.disabled = false;
            }
        }

        // 页面加载时获取自选股列表
        document.addEventListener('DOMContentLoaded', function() {
            loadMyStocks();
        });

        // 点击弹窗背景关闭
        document.getElementById('addModal').addEventListener('click', function(e) {
            if (e.target === this) closeAddModal();
        });
        document.getElementById('moveModal').addEventListener('click', function(e) {
            if (e.target === this) closeMoveModal();
        });
    </script>
</body>
</html>
